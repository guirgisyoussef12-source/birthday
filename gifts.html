<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نجحتي باختبار الحب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',system-ui,sans-serif;line-height:1.8;overflow-x:hidden}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:40px 20px}
/* صفحة الهدايا */
.p-gifts{background:linear-gradient(160deg,#f6dbe3 0%,#efd3e2 50%,#e4d6ee 100%);color:#3b2431}
.gtitle{font-family:'Lalezar','Cairo',sans-serif;font-weight:400;font-size:clamp(2.1rem,9vw,3.1rem);line-height:1.3;color:#c2365b;text-shadow:0 2px 0 rgba(255,255,255,.65)}
.gsub{font-weight:800;color:#3b2431}
.gifts{display:flex;direction:ltr;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px 18px;width:100%;max-width:680px;padding:20px 8px 8px}
.gift{flex:0 0 auto;width:clamp(120px,40vw,170px);background:none;border:0;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.gsvg{display:block;width:100%;animation:bob 2.8s ease-in-out infinite}
.gift:nth-child(2) .gsvg{animation-delay:-.9s}.gift:nth-child(3) .gsvg{animation-delay:-1.8s}
.gsvg svg{width:100%;display:block;overflow:visible}
@keyframes bob{50%{transform:translateY(-9px) rotate(1.5deg)}}
.gift span{font-weight:800;font-size:.95rem}
.gift.open .gsvg{animation:shake .45s}
@keyframes shake{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.gift.open .glid{animation:lid .8s .35s ease forwards}
@keyframes lid{to{transform:translateY(-70px) rotate(-14deg);opacity:0}}
.rise{position:fixed;z-index:70;pointer-events:none;font-size:20px;animation:rise 1.1s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),-150px) scale(1.5);opacity:0}}
.p-gifts .btn.ghost{color:#c2365b}
.glid{transform-origin:100px 100px}
</style>
</head>
<body>
<!-- 2: الهدايا (نسخة من الصفحة التانية في الفيديو) -->
<main class="page p-gifts">
  <h2 class="gtitle">نجحتي باختبار الحب 💗</h2>
  <p class="gsub">مفاجآتچ تنتظرچ، اختاري هدية</p>
  <div class="gifts">
    <button class="gift" data-go="3"><i class="gsvg"></i><span>رسالة من گلبي</span></button>
    <button class="gift" data-go="4"><i class="gsvg"></i><span>وعد 🌹</span></button>
    <button class="gift" data-go="5"><i class="gsvg"></i><span>مفاجأة 🎁</span></button>
  </div>
</main>

<script>
/* عدّل هنا الصفحات اللي تفتحها كل هدية */
const PAGES = { 3: 'letter.html', 4: 'message.html', 5: 'promise.html' };
function go(i) { location.href = PAGES[i]; }
/* صفحة الهدايا */
(() => {
  const L = '#2a5d78', RB = '#f19a94', RS = '#c96a6a';
  const GIFT_SVG = `<svg viewBox="0 0 200 215" aria-hidden="true" stroke-linejoin="round">
    <g stroke="${L}" stroke-width="2.5">
      <polygon points="34,114 100,139 100,204 34,179" fill="#8ed0ec"/>
      <polygon points="100,139 166,114 166,179 100,204" fill="#6fb9db"/>
      <polygon points="58,123 74,129 74,194 58,188" fill="${RB}"/>
      <polygon points="126,129 142,123 142,188 126,194" fill="#e98a85"/>
    </g>
    <g class="glid">
      <g stroke="${L}" stroke-width="2.5">
        <polygon points="24,90 100,118 100,140 24,112" fill="#8ed0ec"/>
        <polygon points="100,118 176,90 176,112 100,140" fill="#6fb9db"/>
        <polygon points="100,62 176,90 100,118 24,90" fill="#a9e0f4"/>
        <polygon points="58,102.5 74,108.4 74,130.4 58,124.5" fill="${RB}"/>
        <polygon points="126,108.4 142,102.5 142,124.5 126,130.4" fill="#e98a85"/>
      </g>
      <polygon points="54.5,78.8 69.5,73.2 145.5,101.2 130.5,106.8" fill="${RB}" stroke="${L}" stroke-width="2"/>
      <polygon points="130.5,73.2 145.5,78.8 69.5,106.8 54.5,101.2" fill="${RB}" stroke="${L}" stroke-width="2"/>
      <g transform="translate(100 84)" stroke="${RS}" stroke-width="2.2">
        <g><path d="M-6 10 C-10 32 -28 42 -38 56 L-18 50 C-9 42 -3 30 2 14Z" fill="#f6bdb9"/>
          <path d="M0 0 C-34 -42 -78 -28 -68 6 C-60 26 -16 20 0 0Z" fill="#f6bdb9"/>
          <path d="M-4 0 C-26 -24 -52 -18 -48 0 C-44 12 -16 10 -4 0Z" fill="#ee8f8c" stroke="none"/>
          <circle cx="-56" cy="-4" r="2" fill="#fff" stroke="none" opacity=".7"/><circle cx="-38" cy="-14" r="2" fill="#fff" stroke="none" opacity=".7"/><circle cx="-30" cy="6" r="2" fill="#fff" stroke="none" opacity=".7"/></g>
        <g transform="scale(-1 1)"><path d="M-6 10 C-10 32 -28 42 -38 56 L-18 50 C-9 42 -3 30 2 14Z" fill="#f6bdb9"/>
          <path d="M0 0 C-34 -42 -78 -28 -68 6 C-60 26 -16 20 0 0Z" fill="#f6bdb9"/>
          <path d="M-4 0 C-26 -24 -52 -18 -48 0 C-44 12 -16 10 -4 0Z" fill="#ee8f8c" stroke="none"/>
          <circle cx="-56" cy="-4" r="2" fill="#fff" stroke="none" opacity=".7"/><circle cx="-38" cy="-14" r="2" fill="#fff" stroke="none" opacity=".7"/><circle cx="-30" cy="6" r="2" fill="#fff" stroke="none" opacity=".7"/></g>
        <ellipse cx="0" cy="3" rx="12" ry="10" fill="${RB}"/>
      </g>
    </g>
  </svg>`;
  document.querySelectorAll('.gsvg').forEach(e => e.innerHTML = GIFT_SVG);

  function hearts(el) {
    const b = el.getBoundingClientRect();
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span'); s.className = 'rise'; s.textContent = ['💗', '💖', '✨'][i % 3];
      s.style.left = b.left + b.width / 2 + 'px'; s.style.top = b.top + b.height * .35 + 'px';
      s.style.setProperty('--dx', (Math.random() - .5) * 160 + 'px'); s.style.animationDelay = Math.random() * .3 + 's';
      document.body.appendChild(s); setTimeout(() => s.remove(), 1600);
    }
  }
  document.querySelectorAll('.gift').forEach(g => g.addEventListener('click', e => {
    e.stopPropagation(); if (g.classList.contains('open')) return;
    g.classList.add('open'); hearts(g); setTimeout(() => go(+g.dataset.go), 1100);
  }));
  window.resetGifts = () => document.querySelectorAll('.gift').forEach(g => g.classList.remove('open'));
})();

</script>
</body>
</html>
