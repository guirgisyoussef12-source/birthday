<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وعد من القلب 💕</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Aesthetic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        romantic: {
                            50: '#fff5f7',
                            100: '#ffe6ec',
                            200: '#fccad6',
                            300: '#f99fb5',
                            400: '#f4698b',
                            500: '#e93b67',
                            600: '#d51b4c',
                            700: '#b3103c',
                            800: '#951137',
                            900: '#7d1334',
                        },
                        cream: {
                            50: '#fdfbf7',
                            100: '#f8f3e9',
                            200: '#f0e4d0',
                            300: '#e5d0b1',
                        },
                        wine: '#5a2131'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        arabicTitle: ['Reem Kufi', 'serif'],
                        amiri: ['Amiri', 'serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 7s ease-in-out 2s infinite',
                        'pulse-slow': 'pulse 3s infinite',
                        'sparkle': 'sparkle 2s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-15px) rotate(2deg)' },
                        },
                        sparkle: {
                            '0%, 100%': { opacity: 0.3, transform: 'scale(0.8)' },
                            '50%': { opacity: 1, transform: 'scale(1.2)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #fff5f7 0%, #f8f3e9 50%, #ffe6ec 100%);
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(149, 17, 55, 0.08);
        }

        .photo-card {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .photo-card:hover {
            transform: translateY(-8px) scale(1.02) rotate(-1deg);
            box-shadow: 0 22px 35px rgba(233, 59, 103, 0.25);
        }

        /* Ambient floating elements */
        .bg-heart {
            position: absolute;
            pointer-events: none;
            color: rgba(244, 105, 139, 0.25);
            animation: float 8s ease-in-out infinite;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fff5f7;
        }
        ::-webkit-scrollbar-thumb {
            background: #f4698b;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between relative text-stone-800">

    <!-- Floating Background Hearts -->
    <div class="bg-heart top-10 right-[10%] text-4xl" style="animation-delay: 0s;"><i class="fa-solid fa-heart"></i></div>
    <div class="bg-heart top-[25%] left-[8%] text-3xl" style="animation-delay: 1.5s;"><i class="fa-solid fa-heart"></i></div>
    <div class="bg-heart bottom-[30%] right-[6%] text-5xl" style="animation-delay: 3s;"><i class="fa-solid fa-heart"></i></div>
    <div class="bg-heart bottom-12 left-[12%] text-4xl" style="animation-delay: 4.5s;"><i class="fa-solid fa-heart"></i></div>

    <!-- Header Section -->
    <header class="w-full pt-8 pb-4 text-center px-4 relative z-10">
        <div class="inline-block px-4 py-1.5 rounded-full bg-romantic-100 text-romantic-700 text-sm font-semibold tracking-wider mb-3 shadow-sm border border-romantic-200">
            <i class="fa-solid fa-sparkles text-romantic-500 mr-1 animate-sparkle"></i> 
            ذكريات ووعود
            <i class="fa-solid fa-sparkles text-romantic-500 ml-1 animate-sparkle"></i>
        </div>
        <h1 class="font-arabicTitle text-3xl sm:text-5xl font-bold text-wine mb-2 leading-snug">
            لحظاتنا الجميلة ✨
        </h1>
        <p class="text-stone-600 text-base sm:text-lg max-w-md mx-auto font-amiri italic">
            كل صورة تحكي حكاية... وكل حكاية تبدأ بكِ
        </p>
    </header>

    <!-- Main Content: Photo Gallery -->
    <main class="max-w-4xl mx-auto px-4 py-4 w-full flex-grow flex flex-col justify-center relative z-10">
        
        <!-- 4 Image Grid Layout -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 md:gap-7 mb-10">
            
            <!-- Image 1 -->
            <div class="photo-card glass-card p-3 sm:p-4 rounded-3xl group relative overflow-hidden">
                <div class="aspect-square w-full rounded-2xl overflow-hidden bg-romantic-100 relative">
                    <img 
                        src="assets/moh_1.jpg" 
                        alt="Romantic Moment 1" 
                        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                    
                    >
                    <div class="absolute inset-0 bg-gradient-to-t from-wine/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                        <span class="text-white text-sm font-medium"><i class="fa-solid fa-heart text-romantic-300 ml-1"></i> دافئ في أحضانك</span>
                    </div>
                </div>
            </div>

            <!-- Image 2 -->
            <div class="photo-card glass-card p-3 sm:p-4 rounded-3xl group relative overflow-hidden sm:translate-y-4">
                <div class="aspect-square w-full rounded-2xl overflow-hidden bg-romantic-100 relative">
                    <img 
                        src="assets/moh_2.jpg" 
                        alt="Romantic Moment 2" 
                        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
        
                    >
                    <div class="absolute inset-0 bg-gradient-to-t from-wine/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                        <span class="text-white text-sm font-medium"><i class="fa-solid fa-heart text-romantic-300 ml-1"></i> سوا مع بعض</span>
                    </div>
                </div>
            </div>

            <!-- Image 3 -->
            <div class="photo-card glass-card p-3 sm:p-4 rounded-3xl group relative overflow-hidden">
                <div class="aspect-square w-full rounded-2xl overflow-hidden bg-romantic-100 relative">
                    <img 
                        src="assets/moh_3.jpg" 
                        alt="Romantic Moment 3" 
                        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                    >
                    <div class="absolute inset-0 bg-gradient-to-t from-wine/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                        <span class="text-white text-sm font-medium"><i class="fa-solid fa-heart text-romantic-300 ml-1"></i> نظرة عينيكِ</span>
                    </div>
                </div>
            </div>

            <!-- Image 4 -->
            <div class="photo-card glass-card p-3 sm:p-4 rounded-3xl group relative overflow-hidden sm:translate-y-4">
                <div class="aspect-square w-full rounded-2xl overflow-hidden bg-romantic-100 relative">
                    <img 
                        src="assets/moh_4.jpg" 
                        alt="Romantic Moment 4" 
                        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                        
                    >
                    <div class="absolute inset-0 bg-gradient-to-t from-wine/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                        <span class="text-white text-sm font-medium"><i class="fa-solid fa-heart text-romantic-300 ml-1"></i> حنيّة وبراءة</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Quote Banner with Iraqi Accent -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 text-center relative overflow-hidden border-2 border-romantic-200/60 shadow-xl max-w-2xl mx-auto mb-6">
            <div class="absolute top-0 right-0 transform translate-x-4 -translate-y-4 text-romantic-100 text-8xl font-serif pointer-events-none select-none">“</div>
            <div class="absolute bottom-0 left-0 transform -translate-x-4 translate-y-4 text-romantic-100 text-8xl font-serif pointer-events-none select-none">”</div>
            
            <i class="fa-solid fa-heart text-romantic-500 text-2xl mb-3 animate-pulse"></i>
            
            <h2 class="text-2xl sm:text-4xl font-extrabold text-wine leading-tight font-cairo tracking-wide mb-2">
                "راح تكونين مالتي بيوم من الأيام"
            </h2>
            
            <p class="text-romantic-600 font-amiri text-lg sm:text-xl mt-2">
                وعد ثابت بقلبي لأخر العمر ❤️
            </p>
        </div>

    </main>

    <!-- Footer & Navigation to Cake Page -->
    <footer class="w-full pb-8 pt-2 text-center relative z-10 px-4">
        <a 
            href="cake.html" 
            class="inline-flex items-center justify-center gap-3 px-8 py-4 bg-gradient-to-r from-romantic-500 via-romantic-600 to-wine text-white rounded-full font-bold text-lg shadow-lg shadow-romantic-500/30 hover:shadow-xl hover:shadow-romantic-500/50 hover:scale-105 active:scale-95 transition-all duration-300 group"
        >
            <span>نطفي الشمعة سوا؟ 🎂</span>
            <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
        </a>
    </footer>

    <!-- Interactive Heart Effects JS -->
    <script>
        // Subtle heart spawn effect on clicking anywhere
        document.addEventListener('click', function(e) {
            // Avoid triggering extra animations when clicking the button
            if (e.target.closest('a')) return;

            const heart = document.createElement('div');
            heart.classList.add('fa-solid', 'fa-heart');
            heart.style.position = 'fixed';
            heart.style.left = (e.clientX - 12) + 'px';
            heart.style.top = (e.clientY - 12) + 'px';
            heart.style.color = '#e93b67';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            heart.style.pointerEvents = 'none';
            heart.style.zIndex = '9999';
            heart.style.transition = 'all 1s ease-out';
            heart.style.opacity = '1';

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.style.transform = `translate(${(Math.random() - 0.5) * 60}px, -80px) scale(1.4)`;
                heart.style.opacity = '0';
            }, 10);

            setTimeout(() => {
                heart.remove();
            }, 1000);
        });
    </script>
</body>
</html>
